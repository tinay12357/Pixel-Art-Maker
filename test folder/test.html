<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Pixel Art Inquiry 2024</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css">
    </head>
    <body>
        <div class="wrapper">
            <!-- Option Menu -->
            <div class="options">
                <div class="opt-wrapper">
                    <div class="grid-size">
                        <label for ="grid-width"> Grid Width </label>
                        <input type= "number" id="grid-width">
                        <span id="width-value">00</span>
                    </div>
                    <div class="grid-size">
                        <label for ="grid-height"> Grid Height </label>
                        <input type= "number" id="grid-height">
                        <span id="length-value">00</span>
                    </div>
                </div>
                <div class="opt-wrapper">
                    <button id="submit-grid">Create Grid</button>
                    <button id="clear-grid">Clear Grid</button>
                    <input type="color" id="color-input">
                    <button id="erase-btn">Erase</button>
                    <button id="paint-btn">Paint</button>
                </div>
            </div>
        </div>
        <!-- Script section-->
        <script src="script.js"></script>
    </body>
</html>
